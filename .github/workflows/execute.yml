name: Execute Technical Analysis Signal

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  run-signal:
    runs-on: ubuntu-latest
    # Added permissions so the agent can write back to your repo
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Bridge Logic
        env:
          Rangus_Jangus: ${{ secrets.Rangus_Jangus }}
        run: python bridge.py

      # NEW: The Persistence Step
      - name: Commit and Push Veritas Payload
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update live market snapshot [skip ci]"
          file_pattern: 'veritas_data.json'
          
