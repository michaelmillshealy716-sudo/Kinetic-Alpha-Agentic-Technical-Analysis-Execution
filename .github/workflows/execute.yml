name: Execute Technical Analysis Signal

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

# This silences the warning by forcing the newer Node engine
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  run-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Bridge Logic
        env:
          Rangus_Jangus: ${{ secrets.Rangus_Jangus }}
        run: python bridge.py
        
